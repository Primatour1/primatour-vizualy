name: Fotky hotelov z primatour.sk

on:
  push:
    paths:
      - 'poziadavky/*.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fotky
  cancel-in-progress: false

jobs:
  fotky:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Stiahni a prekonvertuj fotky
        run: python skripty/fotky_hotela.py
      - name: Ulož výsledok do repozitára
        run: |
          git config user.name "primatour-fotky"
          git config user.email "primatour@primatour.sk"
          git add -A hotely poziadavky
          git diff --cached --quiet && echo "nič nové" || git commit -m "Fotky hotelov: $(date -u +%Y-%m-%d_%H:%M)"
          git pull --rebase origin main
          git push origin HEAD:main
